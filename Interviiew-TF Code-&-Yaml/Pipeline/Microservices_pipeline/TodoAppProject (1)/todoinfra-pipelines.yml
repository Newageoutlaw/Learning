trigger: none
pool: todoapp-agent-pool
stages:
  - stage: securityinitplan
    displayName: security-init-plan 
    jobs: 
    - job: securitychecks 
      displayName: security checks
      steps:
      - task: tfsec@1
        inputs:
          version: 'v1.26.0'
          dir: '$(System.DefaultWorkingDirectory)/Enviorment/dev_env'
    - job: init
      dependsOn: securitychecks
      displayName: init job
      steps:
      - task: TerraformTaskV4@4
        displayName: init task
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(System.DefaultWorkingDirectory)/Enviorment/dev_env'
          commandOptions: '-reconfigure'
          backendServiceArm: 'todoapp_service_connection'
          backendAzureRmResourceGroupName: 'dev-k8s-rg'
          backendAzureRmStorageAccountName: 'appstgram'
          backendAzureRmContainerName: 'devappcon'
          backendAzureRmKey: 'dev-terraform.tfstate'
      - task: TerraformTaskV4@4
        displayName: plan task
        inputs:
          provider: 'azurerm'
          command: 'plan'
          workingDirectory: '$(System.DefaultWorkingDirectory)/Enviorment/dev_env'
          environmentServiceNameAzureRM: 'todoapp_service_connection'
      
  - stage: manualvalidationinitapply
    dependsOn: securityinitplan
    displayName: manual validation init and apply 
    jobs:
    - job: job1manualvalidation
      pool: server
      displayName: manual validation job1
      steps:
      - task: ManualValidation@1
        inputs:
          notifyUsers: 'er.rammishra1984@gmail.com'
          instructions: 'Can you plz approve pipeline'
    - job: job2init 
      dependsOn: job1manualvalidation
      displayName: init job2
      steps:
      - task: TerraformTaskV4@4
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(System.DefaultWorkingDirectory)/Enviorment/dev_env'
          commandOptions: '-reconfigure'
          backendServiceArm: 'todoapp_service_connection'
          backendAzureRmResourceGroupName: 'dev-k8s-rg'
          backendAzureRmStorageAccountName: 'appstgram'
          backendAzureRmContainerName: 'devappcon'
          backendAzureRmKey: 'dev-terraform.tfstate'
      - task: TerraformTaskV4@4
        inputs:
          provider: 'azurerm'
          command: 'apply'
          workingDirectory: '$(System.DefaultWorkingDirectory)/Enviorment/dev_env'
          environmentServiceNameAzureRM: 'todoapp_service_connection'